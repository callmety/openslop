name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (CI alias)
        run: npm run lint:ci

      - name: Format check
        run: npm run format:check

      - name: No console statements
        run: npm run check:no-console

      - name: No network calls
        run: npm run check:no-network

      - name: Branding / denylist audit
        run: npm run audit:branding

      - name: Extension unit tests
        run: npm run test:extension

      - name: Build extension artifacts
        run: npm run build:extension

      - name: Validate extension artifacts and manifests
        run: npm run validate:extension

      - name: Install Playwright Chromium
        run: npm run test:e2e:install

      - name: Extension E2E smoke
        run: xvfb-run -a npm run test:e2e:extension

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/playwright/
          if-no-files-found: ignore
